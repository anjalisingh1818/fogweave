# Keeps the free Render backend awake through judging, so a visitor does not wait
# about a minute for it to wake. Render's free plan sleeps after 15 minutes without
# visits. GitHub may run scheduled jobs late, so the app also waits for a waking
# server (src/app.js, enterLive). Remove after judging (winners: 11 Dec 2026).
name: Keep the backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: curl -s -o /dev/null -w "health %{http_code} in %{time_total}s\n" --max-time 120 https://fogweave-backend.onrender.com/health || true
